<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AKUNTANSIKU - E-Learning Akuntansi Kelas XI SMK</title>
<style>
:root{--p:#1E3A8A;--s:#3B82F6;--bg:#F8FAFC;--c:#FFFFFF;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--ok:#16a34a;--no:#dc2626;--soft:#eff6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--c:#131c2f;--t:#e5e7eb;--m:#94a3b8;--b:#25314a;--soft:#172554}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;min-height:100%;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}a{color:var(--s)}button{font:inherit;cursor:pointer}
.btn{background:var(--p);color:#fff;border:0;padding:.55em 1.1em;border-radius:8px;font-weight:600;text-decoration:none;display:inline-block}.btn:hover{background:var(--s)}
.btn.o{background:transparent;color:var(--p);border:1.5px solid var(--p)}.btn.g{background:var(--soft);color:var(--p)}.btn.d{background:var(--no)}.btn.sm{padding:.3em .7em;font-size:13px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:20px;margin-bottom:16px}
input,select,textarea{font:inherit;width:100%;padding:.55em .75em;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}label{font-weight:600;font-size:13px;display:block;margin:12px 0 4px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.bar{height:9px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--s),var(--p))}
.muted{color:var(--m);font-size:13px}.tag{background:var(--soft);color:var(--p);padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
/* landing */
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 5%;background:var(--c);border-bottom:1px solid var(--b)}.logo{font-weight:800;color:var(--p);font-size:20px}
.hero{background:linear-gradient(135deg,#1E3A8A,#3B82F6);color:#fff;padding:60px 5%;display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:center}
.hero h1{font-size:clamp(28px,5vw,44px)}.hero .btn{background:#fff;color:var(--p)}.sec{padding:50px 5%;max-width:1100px;margin:auto}
.ico{font-size:28px;background:var(--soft);width:52px;height:52px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eff6ff,#dbeafe)}.auth .card{width:100%;max-width:400px;padding:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg label{margin:0;border:1.5px solid var(--b);border-radius:8px;padding:8px;text-align:center;cursor:pointer;font-weight:600}.seg input{display:none}.seg label.on{border-color:var(--p);background:var(--soft);color:var(--p)}
/* shell */
.shell{display:flex;min-height:100vh}aside{width:250px;background:var(--p);color:#fff;padding:18px 12px;flex-shrink:0;transition:.25s;position:sticky;top:0;height:100vh;overflow:auto}
aside .logo{color:#fff;padding:4px 10px 18px}aside a{display:flex;gap:10px;padding:10px 12px;border-radius:8px;color:#dbeafe;text-decoration:none;cursor:pointer;margin-bottom:2px;white-space:nowrap}aside a:hover,aside a.on{background:rgba(255,255,255,.16);color:#fff}
.shell.col aside{width:70px}.shell.col aside .tx{display:none}.shell.col aside .logo span{display:none}
main{flex:1;min-width:0}.top{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top input{max-width:340px}.ham{background:var(--soft);border:0;border-radius:8px;padding:8px 12px;font-size:18px}.content{padding:24px;max-width:1050px}
.bc{font-size:13px;color:var(--m);margin-bottom:14px}.bc a{cursor:pointer;text-decoration:none}
.acc{border:1px solid var(--b);border-radius:10px;margin-bottom:10px;background:var(--c);overflow:hidden}.acc>.hd{padding:14px 16px;display:flex;justify-content:space-between;cursor:pointer;font-weight:700}.acc>.bd{display:none;padding:0 16px 12px}.acc.open>.bd{display:block}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--b);cursor:pointer}
.prose h2{font-size:19px;margin-top:1.2em;color:var(--p)}.prose img,.prose iframe{max-width:100%}.prose iframe{border:0;aspect-ratio:16/9;width:100%}
.tw{overflow-x:auto}table.j{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}table.j th,table.j td{border:1px solid var(--b);padding:7px 10px;text-align:left}table.j th{background:var(--soft);color:var(--p)}
.ed{min-height:220px;border:1px solid var(--b);border-radius:0 0 8px 8px;padding:12px;background:var(--c);outline:none}.tb{display:flex;gap:4px;flex-wrap:wrap;background:var(--soft);padding:6px;border:1px solid var(--b);border-bottom:0;border-radius:8px 8px 0 0}.tb button{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:6px;padding:3px 9px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal>div{background:var(--c);border-radius:14px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.q{border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:12px}.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:14px}.fb.ok{background:#dcfce7;color:#166534}.fb.no{background:#fee2e2;color:#991b1b}
.opt{display:block;margin:4px 0;font-weight:400}.opt input{width:auto;margin-right:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 20px;border-radius:99px;z-index:99}
.stat{font-size:28px;font-weight:800;color:var(--p)}
@media(max-width:800px){aside{position:fixed;left:-260px;z-index:30;width:250px!important;transition:.25s}.shell.mob aside{left:0}.shell.col aside .tx{display:inline}.content{padding:16px}.top{padding:10px 14px}}
</style></head><body><div id="app"></div><div id="m"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const J=(r)=>`<div class="tw"><table class="j"><tr><th>Tanggal</th><th>Keterangan</th><th>Debit</th><th>Kredit</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td style="padding-left:${x[4]?28:10}px">${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</table></div>`;
const SEED=()=>({
course:{title:'Akuntansi Kelas XI SMK',desc:'Akuntansi Perusahaan Dagang: dari jurnal khusus hingga laporan keuangan.'},
users:[{id:'g',role:'guru',name:'Bapak/Ibu Guru Akuntansi',login:'guru',email:'guru@akuntansiku.id'},{id:'s',role:'siswa',name:'Aminaturrokhimah',login:'siswa',email:'amina@akuntansiku.id',kelas:'XI Akuntansi 1'}],
bab:[{id:'b1',t:'Perusahaan Dagang'},{id:'b2',t:'Jurnal Khusus'},{id:'b3',t:'Buku Besar Pembantu'},{id:'b4',t:'Harga Pokok Penjualan (HPP)'},{id:'b5',t:'Jurnal Penyesuaian'},{id:'b6',t:'Laporan Keuangan'}],
done:['m1','m2','m3','m4'],
materi:[
{id:'m1',bab:'b1',t:'Pengertian & Siklus Akuntansi Perusahaan Dagang',goal:'Peserta didik mampu menjelaskan karakteristik perusahaan dagang dan membedakan metode pencatatan persediaan.',pub:1,video:'M7lc1UVf-VE',pdf:{name:'Ringkasan-Perusahaan-Dagang.pdf',url:'#'},lat:'l1',html:`<h2>Apa itu Perusahaan Dagang?</h2><p>Perusahaan dagang adalah perusahaan yang membeli barang dari pemasok lalu menjualnya kembali tanpa mengubah bentuk barang.</p><h2>Metode Pencatatan Persediaan</h2><ul><li><b>Metode Periodik</b>: persediaan dihitung di akhir periode lewat stock opname.</li><li><b>Metode Perpetual</b>: persediaan dicatat setiap ada transaksi.</li></ul><h2>Contoh Transaksi</h2><p>1 Maret: Membeli barang dagang secara tunai Rp5.000.000.</p>${J([['01/03','Pembelian','5.000.000','',0],['','Kas','','5.000.000',1]])}`},
{id:'m2',bab:'b2',t:'Jurnal Penjualan & Pembelian',goal:'Peserta didik mampu mencatat transaksi penjualan dan pembelian kredit pada jurnal khusus.',pub:1,video:'',pdf:null,lat:'l2',html:`<h2>Jurnal Khusus</h2><p>Jurnal khusus digunakan untuk mencatat transaksi sejenis yang sering terjadi, sehingga pencatatan lebih efisien.</p><h2>Contoh: Penjualan Kredit</h2><p>5 Maret: Menjual barang dagang secara kredit kepada CV Maju Rp8.000.000, syarat 2/10, n/30.</p>${J([['05/03','Piutang Dagang','8.000.000','',0],['','Penjualan','','8.000.000',1]])}`},
{id:'m3',bab:'b2',t:'Jurnal Penerimaan & Pengeluaran Kas',goal:'Peserta didik mampu mencatat transaksi kas masuk dan keluar.',pub:1,video:'M7lc1UVf-VE',pdf:null,lat:null,html:`<h2>Jurnal Penerimaan Kas</h2><p>Mencatat semua transaksi yang menyebabkan kas bertambah.</p><p>12 Maret: Diterima pelunasan piutang dari CV Maju Rp7.840.000 (diskon 2%).</p>${J([['12/03','Kas','7.840.000','',0],['','Potongan Penjualan','160.000','',0],['','Piutang Dagang','','8.000.000',1]])}`},
{id:'m4',bab:'b3',t:'Kartu Piutang & Kartu Utang',goal:'Peserta didik mampu menyusun buku besar pembantu piutang dan utang.',pub:1,video:'',pdf:{name:'Format-Kartu-Piutang.pdf',url:'#'},lat:null,html:`<h2>Buku Besar Pembantu</h2><p>Buku besar pembantu merinci akun kontrol (Piutang Dagang/Utang Dagang) per pelanggan atau pemasok. Total saldo buku pembantu harus sama dengan saldo akun kontrol di buku besar.</p>`},
{id:'m5',bab:'b4',t:'Menghitung Harga Pokok Penjualan',goal:'Peserta didik mampu menghitung HPP metode periodik.',pub:1,video:'M7lc1UVf-VE',pdf:null,lat:'l3',html:`<h2>Rumus HPP</h2><p><b>HPP = Persediaan Awal + Pembelian Bersih − Persediaan Akhir</b></p><p>Pembelian Bersih = Pembelian + Beban Angkut Pembelian − Retur Pembelian − Potongan Pembelian.</p><p>Contoh: Persediaan awal Rp10.000.000; pembelian bersih Rp50.000.000; persediaan akhir Rp12.000.000, maka HPP = Rp48.000.000.</p>`},
{id:'m6',bab:'b5',t:'Jurnal Penyesuaian & Laporan Keuangan',goal:'Peserta didik mampu menyusun jurnal penyesuaian dan laporan laba rugi.',pub:1,video:'',pdf:null,lat:null,html:`<h2>Jurnal Penyesuaian</h2><p>Dibuat di akhir periode agar saldo akun sesuai kondisi sebenarnya.</p><p>Contoh: Beban perlengkapan terpakai Rp750.000.</p>${J([['31/12','Beban Perlengkapan','750.000','',0],['','Perlengkapan','','750.000',1]])}<h2>Laporan Keuangan</h2><p>Terdiri dari Laporan Laba Rugi, Perubahan Modal, Posisi Keuangan (Neraca), dan Arus Kas.</p>`}],
lat:[
{id:'l1',t:'Latihan: Perusahaan Dagang',bab:'b1',qs:[{t:'pg',q:'Perusahaan yang membeli dan menjual kembali barang tanpa mengubah bentuknya disebut...',o:['Perusahaan jasa','Perusahaan dagang','Perusahaan manufaktur','Koperasi'],a:'1',e:'Perusahaan dagang tidak mengolah barang, hanya memperjualbelikan.'},{t:'tf',q:'Pada metode perpetual, persediaan dicatat setiap terjadi transaksi.',o:['Benar','Salah'],a:'0',e:'Perpetual = pencatatan persediaan terus-menerus.'},{t:'isian',q:'Metode pencatatan persediaan yang menghitung persediaan lewat stock opname di akhir periode disebut metode ...',a:'periodik',e:'Metode periodik menggunakan stock opname.'}]},
{id:'l2',t:'Latihan: Jurnal Khusus',bab:'b2',qs:[{t:'pg',q:'Transaksi penjualan barang dagang secara kredit dicatat dalam jurnal...',o:['Penerimaan kas','Pengeluaran kas','Penjualan','Umum'],a:'2',e:'Penjualan kredit dicatat di jurnal penjualan.'},{t:'hitung',q:'Penjualan kredit Rp8.000.000 syarat 2/10, n/30 dilunasi hari ke-8. Berapa kas diterima (angka saja)?',a:'7840000|7.840.000',e:'Diskon 2% x 8.000.000 = 160.000; kas = 7.840.000.'}]},
{id:'l3',t:'Latihan: Menghitung HPP',bab:'b4',qs:[{t:'hitung',q:'Persediaan awal 10.000.000; pembelian bersih 50.000.000; persediaan akhir 12.000.000. Berapa HPP?',a:'48000000|48.000.000',e:'10 + 50 − 12 = 48 juta.'},{t:'tf',q:'Retur pembelian menambah pembelian bersih.',o:['Benar','Salah'],a:'1',e:'Retur pembelian mengurangi pembelian bersih.'}]}],
ann:[{id:'a1',t:'Selamat Datang di AKUNTANSIKU',b:'Pelajari materi secara bertahap dan kerjakan latihan mandiri.',d:'2026-10-01'},{id:'a2',t:'Materi Jurnal Khusus Sudah Tersedia',b:'Silakan buka Bab 2 dan tonton video pendukungnya.',d:'2026-10-04'},{id:'a3',t:'Latihan HPP Dibuka',b:'Latihan mandiri Bab 4 siap dikerjakan. Tidak ada nilai, jadi santai saja!',d:'2026-10-07'}]});
let D;try{D=JSON.parse(localStorage.getItem('aku3'))}catch(e){}D=D||SEED();
const save=()=>{try{localStorage.setItem('aku3',JSON.stringify(D))}catch(e){}};
let S={u:null,p:'landing',a:null,q:'',col:0,mob:0,role:'siswa'};
const bc=a=>`<div class="bc">${a.map((x,i)=>i<a.length-1?`<a onclick="go('${x[1]}','${x[2]||''}')">${x[0]}</a>`:`<b>${x[0]}</b>`).join(' › ')}</div>`;
const prog=()=>{const n=D.materi.filter(m=>m.pub).length;return n?Math.round(D.done.filter(i=>D.materi.some(m=>m.id==i&&m.pub)).length/n*100):0};
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const bn=id=>(D.bab.find(b=>b.id==id)||{t:'-'}).t;
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)};
const go=(p,a)=>{S.p=p;S.a=a||null;S.mob=0;render();scrollTo(0,0)};
const yt=u=>(String(u).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/)||[,/^[\w-]{11}$/.test(u)?u:''])[1];
const vid=id=>id?`<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe><p class="muted"><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Buka di YouTube ↗</a></p>`:'';
const NAV={siswa:[['dash','🏠','Dashboard'],['course','📚','Course Saya'],['materi','📖','Materi'],['latihan','✏️','Latihan'],['ann','📢','Pengumuman'],['profil','👤','Profil']],guru:[['dash','🏠','Dashboard'],['course','📚','Course'],['kmateri','📝','Kelola Materi'],['klatihan','✏️','Kelola Latihan'],['kvideo','🎬','Kelola Video'],['bahan','📎','Bahan Pembelajaran'],['ann','📢','Pengumuman'],['set','⚙️','Pengaturan']]};
function render(){const A=$('#app');
if(S.p=='landing')return A.innerHTML=landing();if(S.p=='login')return A.innerHTML=login();
const g=S.u.role=='guru',act=S.p.replace(/^(detail|edit|editlat)$/,x=>x=='detail'?'materi':x=='edit'?'kmateri':'klatihan');
A.innerHTML=`<div class="shell ${S.col?'col':''} ${S.mob?'mob':''}"><aside><div class="logo">📘 <span>AKUNTANSIKU</span></div>${NAV[S.u.role].map(n=>`<a class="${act==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} <span class="tx">${n[2]}</span></a>`).join('')}<a onclick="logout()">🚪 <span class="tx">Keluar</span></a></aside>
<main><div class="top"><button class="ham" onclick="tg()" aria-label="Menu">☰</button><input id="sq" placeholder="🔍 Cari materi/bab" value="${S.q}" onkeydown="if(event.key=='Enter'){S.q=this.value;go(S.u.role=='guru'?'kmateri':'materi')}"><span class="muted" style="margin-left:auto;white-space:nowrap">${S.u.name.split(' ')[0]}</span></div><div class="content">${PG[S.p]()}</div></main></div>`;}
const tg=()=>{if(innerWidth<=800)S.mob=!S.mob;else S.col=!S.col;render()};
function landing(){return`<div class="nav"><span class="logo">📘 AKUNTANSIKU</span><button class="btn" onclick="go('login')">Masuk</button></div><section class="hero"><div><h1>Belajar Akuntansi Kelas XI Jadi Lebih Mudah</h1><p>Materi bertahap, contoh jurnal, video, dan latihan interaktif dengan pembahasan langsung, khusus siswa SMK.</p><button class="btn" onclick="go('login')">Mulai Belajar →</button></div><svg viewBox="0 0 300 220" style="width:100%;max-width:380px;justify-self:center"><rect x="30" y="20" width="170" height="190" rx="12" fill="#fff"/><rect x="45" y="38" width="140" height="22" rx="5" fill="#dbeafe"/><g fill="#93c5fd"><rect x="45" y="72" width="60" height="8"/><rect x="125" y="72" width="60" height="8"/><rect x="45" y="90" width="60" height="8"/><rect x="125" y="90" width="60" height="8"/><rect x="45" y="108" width="60" height="8"/><rect x="125" y="108" width="60" height="8"/></g><rect x="45" y="135" width="140" height="60" rx="6" fill="#1E3A8A"/><path d="M55 185l30-30 25 15 40-25" stroke="#fff" stroke-width="4" fill="none"/><rect x="190" y="70" width="90" height="130" rx="10" fill="#bfdbfe"/><text x="200" y="110" font-size="13" font-weight="700" fill="#1E3A8A">Debit</text><text x="200" y="140" font-size="13" font-weight="700" fill="#1E3A8A">Kredit</text><circle cx="250" cy="170" r="16" fill="#3B82F6"/><text x="243" y="176" font-size="16" fill="#fff" font-weight="700">Rp</text></svg></section>
<section class="sec"><h2 style="text-align:center">Apa yang Bisa Kamu Pelajari?</h2><div class="grid">${[['🏪','Perusahaan Dagang','Siklus & pencatatan persediaan'],['📒','Jurnal Khusus','Penjualan, pembelian, kas'],['👥','Buku Besar Pembantu','Kartu piutang & utang'],['🧮','HPP','Menghitung harga pokok penjualan'],['🔧','Jurnal Penyesuaian','Penyesuaian akhir periode'],['📊','Laporan Keuangan','Laba rugi hingga neraca']].map(f=>`<div class="card"><div class="ico">${f[0]}</div><h3>${f[1]}</h3><p class="muted">${f[2]}</p></div>`).join('')}</div></section><div style="text-align:center;padding:20px" class="muted">© 2026 AKUNTANSIKU</div>`}
function login(){const r=S.role;return`<div class="auth"><div class="card"><div class="logo" style="text-align:center">📘 AKUNTANSIKU</div><p class="muted" style="text-align:center">Masuk untuk melanjutkan belajar</p><div class="seg">${['siswa','guru'].map(x=>`<label class="${r==x?'on':''}"><input type="radio" name="r" onclick="S.role='${x}';render()">${x=='siswa'?'🎓 Siswa':'👩‍🏫 Guru'}</label>`).join('')}</div><label>Email / Username</label><input id="lu" value="${r}"><label>Password</label><input id="lp" type="password" value="demo123"><div class="row sp" style="margin:12px 0"><label style="margin:0;font-weight:400"><input type="checkbox" style="width:auto" checked> Ingat saya</label><a href="#" onclick="toast('Hubungi guru untuk reset password');return false">Lupa password?</a></div><button class="btn" style="width:100%" onclick="doLogin()">Masuk</button><p class="muted" style="text-align:center">Demo: username <b>${r}</b>, password <b>demo123</b></p><p style="text-align:center"><a href="#" onclick="go('landing');return false">← Kembali</a></p></div></div>`}
function doLogin(){const u=D.users.find(x=>x.role==S.role&&(x.login==$('#lu').value.trim()||x.email==$('#lu').value.trim()));if(!u||$('#lp').value!='demo123')return toast('Username atau password salah');S.u=u;go('dash')}
const logout=()=>{S.u=null;go('landing')};
const chk=(q,v)=>q.t=='pg'||q.t=='tf'?String(v)==q.a:q.a.split('|').some(x=>x.toLowerCase().replace(/[\s.rp,]/g,'')==String(v).toLowerCase().replace(/[\s.rp,]/g,''));
const matCard=m=>`<div class="it" onclick="go('detail','${m.id}')"><div><b>${m.t}</b><div class="muted">${bn(m.bab)}</div></div><span>${D.done.includes(m.id)?'✅':'▶'}</span></div>`;
const annList=n=>D.ann.slice().sort((a,b)=>b.d>a.d?1:-1).slice(0,n).map(a=>`<div class="it" style="cursor:default"><div><b>${a.t}</b><div class="muted">${a.d} · ${a.b}</div></div></div>`).join('');
const PG={
dash(){if(S.u.role=='guru')return`<h1>Dashboard Guru</h1><div class="grid"><div class="card"><div class="stat">${D.bab.length}</div>Bab</div><div class="card"><div class="stat">${D.materi.length}</div>Materi</div><div class="card"><div class="stat">${D.lat.length}</div>Set Latihan</div><div class="card"><div class="stat">${D.ann.length}</div>Pengumuman</div></div><div class="card"><h3>Akses Cepat</h3><div class="row"><button class="btn" onclick="go('edit','new')">+ Materi Baru</button><button class="btn g" onclick="go('klatihan')">Kelola Latihan</button><button class="btn g" onclick="go('ann')">Buat Pengumuman</button></div></div><div class="card"><h3>Materi Terbaru</h3>${D.materi.slice(-4).reverse().map(m=>`<div class="it" onclick="go('edit','${m.id}')"><div><b>${m.t}</b><div class="muted">${bn(m.bab)}</div></div><span class="tag">${m.pub?'Terbit':'Draft'}</span></div>`).join('')}</div>`;
const p=prog(),nx=D.materi.find(m=>m.pub&&!D.done.includes(m.id));return`<h1>Selamat datang, ${S.u.name} 👋</h1><div class="card"><div class="muted">Course Saya</div><h2>${D.course.title}</h2>${bar(p)}<div class="row sp" style="margin:8px 0 14px"><span class="muted">Progress ${p}%</span></div><button class="btn" onclick="go('${nx?'detail':'course'}','${nx?nx.id:''}')">Lanjutkan Belajar</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Materi Terbaru</h3>${D.materi.filter(m=>m.pub).slice(-4).reverse().map(matCard).join('')}</div><div class="card"><h3>Pengumuman Terbaru</h3>${annList(3)}</div></div>`},
course(){const g=S.u.role=='guru',p=prog();return bc([['Dashboard','dash'],['Course']])+`<div class="card" style="background:var(--p);color:#fff"><h1>${D.course.title}</h1><p>${D.course.desc}</p>${g?'':`${bar(p)}<div style="margin-top:6px">Progress total: <b>${p}%</b></div>`}</div>`+D.bab.map((b,i)=>{const ms=D.materi.filter(m=>m.bab==b.id&&(g||m.pub));return`<div class="acc ${i==0?'open':''}"><div class="hd" onclick="this.parentNode.classList.toggle('open')"><span>Bab ${i+1}: ${b.t}</span><span class="tag">${ms.length} materi</span></div><div class="bd">${ms.map(m=>g?`<div class="it" onclick="go('edit','${m.id}')"><b>${m.t}</b><span class="tag">${m.pub?'Terbit':'Draft'}</span></div>`:matCard(m)).join('')||'<p class="muted">Belum ada materi.</p>'}${g?`<div class="row" style="margin-top:8px"><button class="btn sm g" onclick="editBab('${b.id}')">Ubah Nama</button><button class="btn sm d" onclick="delBab('${b.id}')">Hapus Bab</button></div>`:''}</div></div>`}).join('')+(g?`<button class="btn" onclick="addBab()">+ Tambah Bab</button>`:'')},
materi(){const q=S.q.toLowerCase(),ms=D.materi.filter(m=>m.pub&&(m.t+bn(m.bab)).toLowerCase().includes(q));return bc([['Dashboard','dash'],['Materi']])+`<h1>Materi</h1>${q?`<p class="muted">Hasil pencarian: "${S.q}" <a onclick="S.q='';render()" style="cursor:pointer">hapus</a></p>`:''}<div class="card">${ms.map(matCard).join('')||'<p class="muted">Tidak ditemukan.</p>'}</div>`},
detail(){const m=D.materi.find(x=>x.id==S.a),L=D.materi.filter(x=>x.pub),i=L.findIndex(x=>x.id==m.id),pv=L[i-1],nx=L[i+1],d=D.done.includes(m.id),ls=D.lat.find(l=>l.id==m.lat);return bc([['Dashboard','dash'],['Course','course'],[bn(m.bab)],[m.t]])+`<div class="card"><span class="tag">${bn(m.bab)}</span><h1 style="margin-top:8px">${m.t}</h1><div class="card" style="background:var(--soft)"><b>🎯 Tujuan Pembelajaran</b><p style="margin:4px 0 0">${m.goal}</p></div><div class="prose">${m.html}</div>${m.video?`<h3>🎬 Video Pembelajaran</h3>${vid(m.video)}`:''}${m.pdf?`<h3>📎 Bahan PDF</h3><a class="btn g" href="${m.pdf.url}" download="${m.pdf.name}">⬇ ${m.pdf.name}</a>`:''}<div class="row" style="margin-top:20px">${ls?`<button class="btn" onclick="openLat('${ls.id}')">✏️ Mulai Latihan</button>`:''}<button class="btn ${d?'o':'g'}" onclick="mark('${m.id}')">${d?'✅ Sudah dipelajari':'Tandai Sudah Dipelajari'}</button></div></div><div class="row sp"><button class="btn o" ${pv?`onclick="go('detail','${pv.id}')"`:'disabled style="opacity:.4"'}>← Materi Sebelumnya</button><button class="btn" ${nx?`onclick="go('detail','${nx.id}')"`:'disabled style="opacity:.4"'}>Materi Berikutnya →</button></div>`},
latihan(){return bc([['Dashboard','dash'],['Latihan']])+`<h1>Latihan Mandiri</h1><p class="muted">Latihan ini hanya untuk belajar, tidak ada nilai yang disimpan.</p><div class="grid">${D.lat.map(l=>`<div class="card"><h3>${l.t}</h3><p class="muted">${bn(l.bab)} · ${l.qs.length} soal</p><button class="btn" onclick="openLat('${l.id}')">Kerjakan</button></div>`).join('')}</div>`},
ann(){const g=S.u.role=='guru';return bc([['Dashboard','dash'],['Pengumuman']])+`<h1>Pengumuman</h1>${g?`<div class="card"><h3>Buat Pengumuman</h3><label>Judul</label><input id="at"><label>Isi</label><textarea id="ab" rows="3"></textarea><br><br><button class="btn" onclick="addAnn()">Publikasikan</button></div>`:''}${D.ann.slice().sort((a,b)=>b.d>a.d?1:-1).map(a=>`<div class="card"><div class="row sp"><b>${a.t}</b><span class="muted">${a.d}</span></div><p>${a.b}</p>${g?`<button class="btn sm d" onclick="D.ann=D.ann.filter(x=>x.id!='${a.id}');save();render()">Hapus</button>`:''}</div>`).join('')}`},
profil(){const u=S.u;return bc([['Dashboard','dash'],['Profil']])+`<div class="card"><h1>👤 Profil</h1><label>Nama</label><input id="pn" value="${u.name}"><label>Kelas</label><input value="${u.kelas}" disabled><label>Email</label><input value="${u.email}" disabled><br><br><div class="row"><button class="btn" onclick="S.u.name=$('#pn').value;save();toast('Profil disimpan');render()">Simpan</button><button class="btn o" onclick="D.done=[];save();toast('Progress direset');render()">Reset Progress</button></div></div>`},
kmateri(){const q=S.q.toLowerCase();return bc([['Dashboard','dash'],['Kelola Materi']])+`<div class="row sp"><h1>Kelola Materi</h1><button class="btn" onclick="go('edit','new')">+ Materi Baru</button></div><div class="card">${D.materi.filter(m=>(m.t+bn(m.bab)).toLowerCase().includes(q)).map(m=>`<div class="it" style="cursor:default"><div><b>${m.t}</b><div class="muted">${bn(m.bab)} · <span class="tag">${m.pub?'Terbit':'Draft'}</span></div></div><div class="row"><button class="btn sm g" onclick="go('edit','${m.id}')">Edit</button><button class="btn sm g" onclick="D.materi.find(x=>x.id=='${m.id}').pub^=1;save();render()">${m.pub?'Tarik':'Terbitkan'}</button><button class="btn sm d" onclick="if(confirm('Hapus materi?')){D.materi=D.materi.filter(x=>x.id!='${m.id}');save();render()}">Hapus</button></div></div>`).join('')}</div>`},
edit(){const n=S.a=='new',m=n?{t:'',bab:D.bab[0].id,goal:'',html:'',video:'',pub:0}:D.materi.find(x=>x.id==S.a);return bc([['Kelola Materi','kmateri'],[n?'Materi Baru':'Edit Materi']])+`<div class="card"><h2>${n?'Tambah':'Edit'} Materi</h2><label>Judul</label><input id="et" value="${m.t}"><label>Bab</label><select id="eb">${D.bab.map(b=>`<option value="${b.id}" ${b.id==m.bab?'selected':''}>${b.t}</option>`).join('')}</select><label>Tujuan Pembelajaran</label><textarea id="eg" rows="2">${m.goal}</textarea><label>Isi Materi</label><div class="tb">${[['B','bold'],['I','italic'],['U','underline'],['H2','formatBlock:h2'],['¶','formatBlock:p'],['• List','insertUnorderedList'],['1. List','insertOrderedList']].map(b=>`<button type="button" onmousedown="event.preventDefault();ex('${b[1]}')">${b[0]}</button>`).join('')}<button type="button" onmousedown="event.preventDefault();insJ()">📒 Tabel Jurnal</button><button type="button" onmousedown="event.preventDefault();insImg()">🖼 Gambar</button><button type="button" onmousedown="event.preventDefault();insYT()">▶ YouTube</button></div><div class="ed" id="ee" contenteditable="true">${m.html}</div><label>Video Utama (link YouTube)</label><input id="ev" value="${m.video?'https://youtu.be/'+m.video:''}" placeholder="https://youtu.be/..."><label>Lampiran PDF</label><input type="file" id="ef" accept="application/pdf">${m.pdf?`<p class="muted">Saat ini: ${m.pdf.name}</p>`:''}<label>Latihan Terkait</label><select id="el"><option value="">- tanpa latihan -</option>${D.lat.map(l=>`<option value="${l.id}" ${l.id==m.lat?'selected':''}>${l.t}</option>`).join('')}</select><label style="font-weight:400"><input type="checkbox" id="ep" style="width:auto" ${m.pub?'checked':''}> Publikasikan</label><br><div class="row"><button class="btn" onclick="saveM('${S.a}')">Simpan</button><button class="btn o" onclick="go('kmateri')">Batal</button></div></div>`},
klatihan(){return bc([['Dashboard','dash'],['Kelola Latihan']])+`<div class="row sp"><h1>Kelola Latihan</h1><button class="btn" onclick="newLat()">+ Set Latihan</button></div>${D.lat.map(l=>`<div class="card"><div class="row sp"><div><b>${l.t}</b><div class="muted">${bn(l.bab)} · ${l.qs.length} soal</div></div><div class="row"><button class="btn sm g" onclick="go('editlat','${l.id}')">Edit Soal</button><button class="btn sm g" onclick="openLat('${l.id}')">Coba</button><button class="btn sm d" onclick="if(confirm('Hapus set?')){D.lat=D.lat.filter(x=>x.id!='${l.id}');save();render()}">Hapus</button></div></div></div>`).join('')}`},
editlat(){const l=D.lat.find(x=>x.id==S.a);return bc([['Kelola Latihan','klatihan'],[l.t]])+`<div class="card"><label>Judul Set</label><input value="${l.t}" onchange="D.lat.find(x=>x.id=='${l.id}').t=this.value;save()"></div>${l.qs.map((q,i)=>`<div class="card"><div class="row sp"><b>${i+1}. [${q.t}] ${q.q}</b><button class="btn sm d" onclick="D.lat.find(x=>x.id=='${l.id}').qs.splice(${i},1);save();render()">Hapus</button></div><div class="muted">Kunci: ${q.t=='pg'||q.t=='tf'?q.o[q.a]:q.a} · Pembahasan: ${q.e}</div></div>`).join('')}<div class="card"><h3>Tambah Soal</h3><label>Tipe</label><select id="qt"><option value="pg">Pilihan Ganda</option><option value="tf">Benar/Salah</option><option value="isian">Isian</option><option value="hitung">Perhitungan</option></select><label>Pertanyaan</label><textarea id="qq" rows="2"></textarea><label>Opsi PG (satu per baris)</label><textarea id="qo" rows="4"></textarea><label>Kunci Jawaban (PG: nomor opsi 1-4 · B/S: B atau S · isian/hitung: teks, pisahkan "|" untuk alternatif)</label><input id="qa"><label>Pembahasan</label><textarea id="qe" rows="2"></textarea><br><br><button class="btn" onclick="addQ('${l.id}')">Tambah Soal</button></div>`},
kvideo(){return bc([['Dashboard','dash'],['Kelola Video']])+`<h1>Kelola Video</h1><div class="card">${D.materi.map(m=>`<label>${m.t}</label><div class="row"><input style="flex:1" value="${m.video?'https://youtu.be/'+m.video:''}" placeholder="Tempel link YouTube" onchange="D.materi.find(x=>x.id=='${m.id}').video=yt(this.value);save();toast('Video disimpan')"></div>`).join('')}</div>`},
bahan(){return bc([['Dashboard','dash'],['Bahan Pembelajaran']])+`<h1>Bahan Pembelajaran</h1><div class="card">${D.materi.map(m=>`<div class="it" style="cursor:default"><div><b>${m.t}</b><div class="muted">${m.pdf?'📎 '+m.pdf.name:'Belum ada PDF'}</div></div><div class="row"><input type="file" accept="application/pdf" style="max-width:210px" onchange="upPdf('${m.id}',this)">${m.pdf?`<button class="btn sm d" onclick="D.materi.find(x=>x.id=='${m.id}').pdf=null;save();render()">Hapus</button>`:''}</div></div>`).join('')}</div>`},
set(){return bc([['Dashboard','dash'],['Pengaturan']])+`<div class="card"><h1>Pengaturan Course</h1><label>Nama Course</label><input id="sc" value="${D.course.title}"><label>Deskripsi</label><textarea id="sd" rows="2">${D.course.desc}</textarea><br><br><div class="row"><button class="btn" onclick="D.course={title:$('#sc').value,desc:$('#sd').value};save();toast('Tersimpan')">Simpan</button><button class="btn d" onclick="if(confirm('Kembalikan data demo?')){D=SEED();save();render()}">Reset Data Demo</button></div></div>`}};
const mark=id=>{D.done=D.done.includes(id)?D.done.filter(x=>x!=id):[...D.done,id];save();toast(D.done.includes(id)?'Ditandai sudah dipelajari ✅':'Tanda dihapus');render()};
const addAnn=()=>{const t=$('#at').value.trim();if(!t)return toast('Judul wajib diisi');D.ann.push({id:uid(),t,b:$('#ab').value,d:new Date().toISOString().slice(0,10)});save();render()};
const addBab=()=>{const t=prompt('Nama bab baru:');if(t){D.bab.push({id:uid(),t});save();render()}};
const editBab=id=>{const b=D.bab.find(x=>x.id==id),t=prompt('Nama bab:',b.t);if(t){b.t=t;save();render()}};
const delBab=id=>{if(confirm('Hapus bab beserta materinya?')){D.bab=D.bab.filter(x=>x.id!=id);D.materi=D.materi.filter(m=>m.bab!=id);save();render()}};
const ex=c=>{const[a,b]=c.split(':');$('#ee').focus();document.execCommand(a,false,b||null)};
const insJ=()=>{$('#ee').focus();document.execCommand('insertHTML',false,J([['dd/mm','Akun Debit','0','',0],['','Akun Kredit','','0',1]])+'<p><br></p>')};
const insImg=()=>{const u=prompt('URL gambar:');if(u){$('#ee').focus();document.execCommand('insertImage',false,u)}};
const insYT=()=>{const i=yt(prompt('Link YouTube:')||'');if(i){$('#ee').focus();document.execCommand('insertHTML',false,`<iframe src="https://www.youtube.com/embed/${i}" allowfullscreen></iframe><p><br></p>`)}};
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb({name:f.name,url:r.result});r.readAsDataURL(f)};
const upPdf=(id,inp)=>{const f=inp.files[0];if(f)rd(f,p=>{D.materi.find(x=>x.id==id).pdf=p;save();render()})};
function saveM(id){const o={t:$('#et').value.trim(),bab:$('#eb').value,goal:$('#eg').value,html:$('#ee').innerHTML,video:yt($('#ev').value),lat:$('#el').value||null,pub:$('#ep').checked?1:0};if(!o.t)return toast('Judul wajib diisi');const fin=pdf=>{let m=D.materi.find(x=>x.id==id);if(!m){m={id:uid(),pdf:null};D.materi.push(m)}Object.assign(m,o);if(pdf)m.pdf=pdf;save();toast('Materi disimpan');go('kmateri')};const f=$('#ef').files[0];f?rd(f,fin):fin()}
const newLat=()=>{D.lat.push({id:uid(),t:'Latihan Baru',bab:D.bab[0].id,qs:[]});save();go('editlat',D.lat[D.lat.length-1].id)};
function addQ(id){const t=$('#qt').value,q=$('#qq').value.trim(),e=$('#qe').value.trim(),k=$('#qa').value.trim();if(!q||!k)return toast('Pertanyaan & kunci wajib diisi');const o={t,q,e:e||'-'};if(t=='pg'){o.o=$('#qo').value.split('\n').filter(Boolean);if(o.o.length<2)return toast('Isi minimal 2 opsi');o.a=String(+k-1)}else if(t=='tf'){o.o=['Benar','Salah'];o.a=/^b/i.test(k)?'0':'1'}else o.a=k;D.lat.find(x=>x.id==id).qs.push(o);save();render()}
function openLat(id){const l=D.lat.find(x=>x.id==id);window.CL=l;$('#m').innerHTML=`<div class="modal"><div><div class="row sp"><h2>${l.t}</h2><button class="btn sm o" onclick="$('#m').innerHTML=''">✕ Tutup</button></div><p class="muted">Jawab lalu tekan "Periksa" untuk umpan balik langsung. Tidak ada nilai yang disimpan.</p>${l.qs.map((q,i)=>`<div class="q"><b>${i+1}. ${q.q}</b><div style="margin-top:8px">${q.o?q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${o}</label>`).join(''):`<input id="t${i}" placeholder="Jawaban Anda...">`}</div><button class="btn sm" style="margin-top:8px" onclick="cek(${i})">Periksa</button><div id="f${i}"></div></div>`).join('')||'<p>Belum ada soal.</p>'}<button class="btn" onclick="$('#m').innerHTML=''">Selesai</button></div></div>`}
function cek(i){const q=CL.qs[i];let v=q.o?(document.querySelector(`input[name=q${i}]:checked`)||{}).value:$('#t'+i).value;if(v===undefined||v==='')return toast('Isi jawaban dulu');const ok=chk(q,v),ans=q.o?q.o[q.a]:q.a.split('|')[0];$('#f'+i).innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Benar!':'❌ Belum tepat. Jawaban: <b>'+ans+'</b>'}<br><span>💡 ${q.e}</span></div>`}
render();
</script></body></html>
